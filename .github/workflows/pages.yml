# Publishes the console in site/ to GitHub Pages whenever it changes on ts-prod.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The page infers the repository from its own URL (<owner>.github.io/<repo>/), so a fork's
# Pages site drives that fork's pipeline; change it under "connect" on the page.
name: Console (GitHub Pages)

on:
  push:
    branches: [ts-prod]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy console
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

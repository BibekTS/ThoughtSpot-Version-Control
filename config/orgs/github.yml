org_key: github
display_name: Mike Batovsky Dev

# Tag applied to objects in the source org to queue them for migration.
# Objects without this tag are ignored.
migration_tag: Github_ReadyForMigration
# GUID of the tag above. Find it in ThoughtSpot Admin > Tags, click the tag,
# copy the GUID from the URL (?id=...). Required when the service account lacks
# TAGMANAGEMENT privilege (can't resolve it via /tags/search).
migration_tag_guid: "56778adb-9c24-452e-b933-d0f828da020a"

source:
  base_url: https://ps-internal.thoughtspot.cloud/
  org_id: 1530174970  # Mike Batovsky Dev

target:
  base_url: https://ps-internal.thoughtspot.cloud/  # same cluster, different org
  org_id: 426706049  # Batovsky Prod Demo

# include: pull dependencies even if not tagged
# skip_if_exists: skip a dependency that already exists in target
# require_tagged: only migrate explicitly tagged objects (no auto-deps)
dependency_mode: include

# obj_ids that are never pulled in as dependencies. These are built-in objects that exist in
# every org: real content depends on them, but they must not be migrated.
#   TSBIServer-eaab6de7             "TS: BI Server" worksheet (used by the Mike's Demo liveboard)
#   SampleRetail-Apparel-cd252e5c   "(Sample) Retail - Apparel" sample data (used by one answer)
dependency_exclude:
  - TSBIServer-eaab6de7
  - SampleRetail-Apparel-cd252e5c

variables:
  # ts_variable_name: name of the ThoughtSpot variable (required).
  # source_value / target_value: optional overrides.
  #   Leave blank when the variable is already configured in ThoughtSpot Admin > Variables.
  #   The pipeline will verify the variable exists and skip setting its value.
  #   Provide a value here only if you want the pipeline to manage it.
  database:
    ts_variable_name: bat_db_var
    source_value: ""
    target_value: ""
  schema:
    ts_variable_name: bat_schema_var
    source_value: ""
    target_value: ""
  extra: []
